[package]
name = "iaot"
version = "0.3.0"
edition = "2021"
description = "Authorized jailed-iOS ahead-of-time instrumentation project and offline tooling"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
object = { version = "0.36", features = ["read_core", "macho"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
