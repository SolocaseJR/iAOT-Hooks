schema_version: 1

analysis:
  scripting_backend: auto
  il2cpp_module: null
  static_il2cpp: true
  runtime_il2cpp: true
  il2cpp_method_manifest: generated/reports/il2cpp-methods.yaml
  external_analyzer: auto

runtime:
  # Directory or file from a Cpp2IL/Il2CppDumper export. Leave null when
  # exported runtime metadata is sufficient.
  metadata_package: null
  metadata_format: auto
  string_factory: null
  offline_classes: []
  offline_methods: []
  offline_fields: []
  offline_internal_calls: []
