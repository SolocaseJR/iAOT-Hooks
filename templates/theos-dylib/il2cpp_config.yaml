schema_version: 1

# IL2CPP classes, methods and fields are found by name at runtime through the
# game's own il2cpp_* exports, so no Cpp2IL/Il2CppDumper dump and no addresses
# are needed here. A game update keeps working as long as the names exist.
analysis:
  scripting_backend: auto
  il2cpp_module: null
  static_il2cpp: true
  runtime_il2cpp: true
  il2cpp_method_manifest: generated/reports/il2cpp-methods.yaml
  external_analyzer: auto
