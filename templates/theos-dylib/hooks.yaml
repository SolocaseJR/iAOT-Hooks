schema_version: 2
project_config: configs.yaml

# Hook-local runtime values. General project/build settings belong in
# configs.yaml; IL2CPP metadata and imports belong in il2cpp_config.yaml.
config:
  flags: [{ name: example_hook_enabled, index: 0, default: false }]
  strings: []

functions: []
generated_hooks: [{ name: UserHooks, symbol: IAOT_InstallUserHooks }]

patches:
  - name: ExampleHook
    enabled: false
    description: "Disabled placeholder; replace the locator and ABI before enabling"
    replacement: IAOT_ExampleHook
    preserve_original: true
    module: main
    signature: "int(void*, int)"
    failure_behavior: disable_hook
    architectures: [arm64]
    locator: { type: pattern, pattern: "FD 7B BF A9", expected_matches: 1, segment: "__TEXT", section: "__text" }
    patch: { type: branch_to_cave }
    expect: auto
